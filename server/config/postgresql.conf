listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 128MB
timezone = 'UTC'
password_encryption = 'scram-sha-256'
ssl = off
hba_file = '/run/config/pg_hba.conf'
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on
log_statement = 'none'
idle_in_transaction_session_timeout = '60s'
statement_timeout = '30s'
