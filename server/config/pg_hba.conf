# Superuser: local container socket only. Network logins require SCRAM passwords.
local all all trust
host all repaircalc_admin 0.0.0.0/0 reject
host all repaircalc_admin ::/0 reject
host repaircalc +repaircalc_owner 0.0.0.0/0 scram-sha-256
host repaircalc +repaircalc_owner ::/0 scram-sha-256
host repaircalc repaircalc_app,repaircalc_reader 0.0.0.0/0 scram-sha-256
host repaircalc repaircalc_app,repaircalc_reader ::/0 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
