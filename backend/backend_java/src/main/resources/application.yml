server:
  port: 8000
  servlet:
    context-path: /api/v1
  compression:
    enabled: true

spring:
  application:
    name: repaircalc-backend
  config:
    import: optional:file:../../server/.secrets/backend.properties
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/repaircalc?currentSchema=repaircalc}
    username: ${DB_USERNAME:repaircalc_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: repaircalc
  web:
    cors:
      allowed-origins: "http://127.0.0.1:4173,http://localhost:4173"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
